<div class="card shadow-sm mb-4">
  <div class="card-body">
    <h3>{{ trip.name }}</h3>
    <p><strong>Trip Code:</strong> {{ trip.code }}</p>
    <p><strong>Duration:</strong> {{ trip.length }}</p>
    <p><strong>Start Date:</strong> {{ trip.start }}</p>
    <p><strong>Resort:</strong> {{ trip.resort }}</p>
    <p><strong>Price Per Person:</strong> {{ trip.perPerson }}</p>
    <p>{{ trip.description }}</p>
    <button type="button" class="btn btn-primary" (click)="editTrip()">Edit Trip</button>
  </div>
</div>
