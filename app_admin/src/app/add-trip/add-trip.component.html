
<h2>Add New Trip</h2>
<p>Enter the vacation package details below.</p>

<form [formGroup]="addForm" (ngSubmit)="onSubmit()">

  <div>
    <label for="code">Trip Code:</label>
    <input type="text" id="code" formControlName="code">
  </div>

  <div>
    <label for="name">Trip Name:</label>
    <input type="text" id="name" formControlName="name">
  </div>

  <div>
    <label for="length">Duration:</label>
    <input type="text" id="length" formControlName="length">
  </div>

  <div>
    <label for="start">Start Date:</label>
    <input type="date" id="start" formControlName="start">
  </div>

  <div>
    <label for="resort">Resort:</label>
    <input type="text" id="resort" formControlName="resort">
  </div>

  <div>
    <label for="perPerson">Price Per Person:</label>
    <input type="number" id="perPerson" formControlName="perPerson">
  </div>

  <div>
    <label for="image">Image Filename:</label>
    <input type="text" id="image" formControlName="image">
  </div>

  <div>
    <label for="description">Description:</label>
    <textarea id="description" formControlName="description"></textarea>
  </div>

  <button type="submit">Save Trip</button>

</form>
